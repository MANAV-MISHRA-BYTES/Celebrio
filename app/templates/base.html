<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f7f4">
  <title>{% block title %}Celebrio — AI Event Planning, Simplified{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.home') }}"><span class="brand-mark">c</span><span>celebrio<span class="brand-dot">.</span></span></a>
    <nav class="top-nav" aria-label="Main navigation"><a href="{{ url_for('main.home') }}#how">How it works</a><a href="{{ url_for('main.home') }}#features">Features</a></nav>
    <a class="button button-dark nav-cta" href="{{ url_for('main.create') }}">Plan an event <span aria-hidden="true">↗</span></a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="footer"><a class="brand" href="{{ url_for('main.home') }}"><span class="brand-mark">c</span><span>celebrio<span class="brand-dot">.</span></span></a><span>Thoughtful plans for life's best moments.</span><span>AI Event Planning, Simplified</span></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
